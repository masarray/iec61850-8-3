name: native-ci

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / C++20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DAR61850_DMS_BUILD_TESTS=ON -DAR61850_DMS_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload standalone server
        uses: actions/upload-artifact@v4
        with:
          name: ar61850-dms-server-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ar61850_dms_server
            build/Release/ar61850_dms_server.exe
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
